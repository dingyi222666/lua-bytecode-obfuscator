<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>lua-bytecode-obfuscator (web)</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  fieldset { border: 1px solid #bbb; margin: 1rem 0; padding: .75rem; }
  legend { font-weight: 600; padding: 0 .4rem; }
  label { display: inline-block; margin-right: 1rem; }
  button { padding: .5rem 1.2rem; }
  #status { white-space: pre-wrap; }
  #report { white-space: pre-wrap; background: #f6f6f6; padding: .75rem; }
  #download:disabled { color: #888; }
</style>
</head>
<body>
<h1>lua-bytecode-obfuscator</h1>
<p>Web front-end over the common obfuscation pipeline (roadmap step 6).
Obfuscation runs in a <a href="https://developer.mozilla.org/docs/Web/API/Worker">Web Worker</a>
on top of the Kotlin/JS build of <code>:lua-runtime-js</code>.</p>

<fieldset>
  <legend>1. Chunk file (luac output)</legend>
  <input type="file" id="file">
</fieldset>

<fieldset>
  <legend>2. Pipeline preset</legend>
  <label><input type="radio" name="preset" value="none"> none</label>
  <label><input type="radio" name="preset" value="light"> light</label>
  <label><input type="radio" name="preset" value="balanced" checked> balanced</label>
  <label><input type="radio" name="preset" value="aggressive"> aggressive</label>
  <br>
  <label>pin seed (optional): <input type="text" id="seed" size="12" placeholder="e.g. 20260917"></label>
</fieldset>

<p>
  <button id="run" disabled>3. Obfuscate</button>
  <a id="download" download="obfuscated.luac" disabled>4. Download result</a>
</p>

<p id="status">pick a file to begin</p>
<pre id="report" hidden></pre>

<script>
"use strict";

var state = { busy: false, chunkBase64: null, url: null };
var worker = new Worker("worker.js");

function el(id) { return document.getElementById(id); }

worker.onmessage = function (event) {
  var message = event.data;
  if (message.id !== state.requestId) { return; }
  state.busy = false;
  el("run").disabled = false;
  if (message.ok) {
    el("status").textContent = "done (" + message.version + ")";
    el("report").hidden = false;
    el("report").textContent = message.reportText;
    // Download: turn the obfuscated bytes into a blob URL.
    var bytes = base64ToBytes(message.chunkBase64);
    if (state.url) { URL.revokeObjectURL(state.url); }
    state.url = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));
    var link = el("download");
    link.href = state.url;
    link.disabled = false;
  } else {
    el("status").textContent = "failed: " + message.message;
  }
};

el("file").addEventListener("change", function () {
  var file = el("file").files[0];
  if (!file) { return; }
  var reader = new FileReader();
  reader.onload = function () {
    state.chunkBase64 = bytesToBase64(new Uint8Array(reader.result));
    el("run").disabled = false;
    el("status").textContent = "loaded " + file.name + " (" + file.size + " bytes)";
  };
  reader.readAsArrayBuffer(file);
});

el("run").addEventListener("click", function () {
  if (!state.chunkBase64 || state.busy) { return; }
  state.busy = true;
  state.requestId = Date.now();
  el("run").disabled = true;
  el("download").disabled = true;
  el("status").textContent = "obfuscating...";
  worker.postMessage({
    id: state.requestId,
    chunkBase64: state.chunkBase64,
    request: {
      preset: document.querySelector("input[name=preset]:checked").value,
      masterSeed: el("seed").value ? Number(el("seed").value) : null,
    },
  });
});

// ---- base64 glue (the Kotlin API is bytes-in / bytes-out) ----------------

function bytesToBase64(bytes) {
  var binary = "";
  for (var i = 0; i < bytes.length; i++) { binary += String.fromCharCode(bytes[i]); }
  return btoa(binary);
}

function base64ToBytes(base64) {
  var padded = base64 + "====".slice((4 - (base64.length % 4)) % 4);
  var binary = atob(padded);
  var bytes = new Uint8Array(binary.length);
  for (var i = 0; i < binary.length; i++) { bytes[i] = binary.charCodeAt(i); }
  return bytes;
}
</script>
</body>
</html>
