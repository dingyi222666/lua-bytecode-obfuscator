kotlin.code.style=official
# Link the nodejs-target IR output as one whole-program file: :lua-runtime-js
# `webDist` ships a single UMD bundle (build/web/luabytecode-runtime.js) that
# the static page's worker load via importScripts — with the default per-module
# granularity the bundle is only the ~30K orphan entry module and the library
# dependencies never make it into the file. The js test runtime is affected the
# same way and has been verified compatible with whole-program linking.
kotlin.js.ir.output.granularity=whole-program
