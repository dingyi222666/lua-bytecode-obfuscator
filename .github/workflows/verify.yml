name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (JVM 17)
    runs-on: [self-hosted, lua-obf]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (pre-seeded on runner)
        run: |
          JDK="$RUNNER_TOOL_CACHE/Java_Temurin-Hotspot_jdk/17.0.20.1+1/x64"
          [ -x "$JDK/bin/java" ] || { echo "JDK not found at $JDK"; exit 1; }
          echo "JAVA_HOME=$JDK" >> "$GITHUB_ENV"
          echo "$JDK/bin" >> "$GITHUB_PATH"

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Native CLI smoke (linked release executable)
        run: |
          EXE=apps/lua-cli-native/build/bin/native/releaseExecutable/lua-cli-native.kexe
          test -x "$EXE" || { echo "release executable not linked at $EXE"; exit 1; }
          "$EXE" --help > /dev/null
          echo "native CLI runs: $EXE"

      - name: KMP purity gate
        run: bash tools/verify-kmp-purity.sh

      - name: Web dist smoke (js runtime bundle)
        run: |
          ./gradlew :lua-runtime-js:webDist --stacktrace
          BUNDLE=apps/lua-runtime-js/build/web/luabytecode-runtime.js
          # The js API is consumed as one whole-program UMD file (regression
          # guard for kotlin.js.ir.output.granularity=whole-program in
          # gradle.properties): with per-module granularity the bundle is just
          # the ~30K orphan entry module with no pipeline inside.
          test -f "$BUNDLE" || { echo "missing bundle: $BUNDLE"; exit 1; }
          SIZE=$(wc -c < "$BUNDLE")
          echo "bundle bytes: $SIZE"
          [ "$SIZE" -gt 500000 ] || { echo "bundle too small ($SIZE bytes): per-module IR output regression"; exit 1; }
          grep -q obfuscateLuaChunk "$BUNDLE" || { echo "obfuscateLuaChunk export missing from bundle"; exit 1; }
          echo "web dist ok: $BUNDLE ($SIZE bytes)"

      - name: Compose web dist smoke (:lua-web-compose)
        run: |
          ./gradlew :lua-web-compose:wasmJsBrowserDistribution --stacktrace
          DIST=apps/lua-web-compose/build/dist/wasmJs/productionExecutable
          test -d "$DIST" || { echo "missing dist dir: $DIST"; exit 1; }
          ls -la "$DIST"
          # Module script: composeApp.mjs on current KGP, .js on older layouts
          # (outputModuleName is pinned to composeApp in build.gradle.kts).
          test -f "$DIST/composeApp.mjs" || test -f "$DIST/composeApp.js" || { echo "missing composeApp.mjs/.js in $DIST"; exit 1; }
          # The Compose UI + full pipeline must be inside the wasm artifact:
          # a few MB after binaryen; a stub-sized wasm means the link lost the
          # library stack.
          WASM=$(find "$DIST" -maxdepth 1 -name '*.wasm' | head -1)
          test -n "$WASM" || { echo "no .wasm artifact in $DIST"; exit 1; }
          WSIZE=$(wc -c < "$WASM")
          echo "wasm bytes: $WSIZE ($WASM)"
          [ "$WSIZE" -gt 1000000 ] || { echo "wasm too small ($WSIZE bytes): UI/pipeline missing from link"; exit 1; }
          # The shipped page must be the Compose one loading the pinned module.
          test -f "$DIST/index.html" || { echo "missing index.html in $DIST"; exit 1; }
          grep -q composeApp "$DIST/index.html" || { echo "index.html does not load the composeApp module"; exit 1; }
          # The entry is a webpack UMD bundle: its runtime auto-detects
          # publicPath from document.currentScript, which exists ONLY for
          # classic script tags. Dynamic import()/type=module makes detection
          # throw "Automatic publicPath is not supported in this browser", so
          # the page MUST load the entry via a plain classic <script src>.
          grep -qE '<script src="\./composeApp\.js"></script>' "$DIST/index.html" || { echo "index.html must load composeApp.js via a classic script tag (see the publicPath note in apps/lua-web-compose/src/wasmJsMain/resources/index.html)"; exit 1; }
          ! grep -q 'await import' "$DIST/index.html" || { echo "index.html must not dynamic-import the entry (publicPath regression)"; exit 1; }
          echo "compose web dist ok: $DIST"

      - name: Upload compose web dist (web-compose-dist)
        uses: actions/upload-artifact@v4
        with:
          name: web-compose-dist
          path: apps/lua-web-compose/build/dist/wasmJs/productionExecutable/
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

  differential-matrix:
    name: Differential matrix (lua 5.3/5.4/5.5, probe-then-run)
    needs: build
    runs-on: [self-hosted, lua-obf]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (pre-seeded on runner)
        run: |
          JDK="$RUNNER_TOOL_CACHE/Java_Temurin-Hotspot_jdk/17.0.20.1+1/x64"
          [ -x "$JDK/bin/java" ] || { echo "JDK not found at $JDK"; exit 1; }
          echo "JAVA_HOME=$JDK" >> "$GITHUB_ENV"
          echo "$JDK/bin" >> "$GITHUB_PATH"

      # Roadmap step 7: the real-interpreter differential matrix. The step
      # probes the runner for the lua 5.3.6/5.4.6/5.5.1 source builds the
      # tools/verify-*.sh scripts expect; when they are absent it prints an
      # explicit skip reason per missing piece and exits 0 (a skipped pillar,
      # never a silent pass and never a red gate on unprovisioned machines).
      # When the environment IS present it runs tools/verify-all.sh end to end.
      - name: Real-interpreter differential matrix (probe, then verify-all)
        run: bash tools/run-differential-matrix.sh
