name: Verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (JVM 17)
    runs-on: [self-hosted, lua-obf]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17 (pre-seeded on runner)
        run: |
          JDK="$RUNNER_TOOL_CACHE/Java_Temurin-Hotspot_jdk/17.0.20.1+1/x64"
          [ -x "$JDK/bin/java" ] || { echo "JDK not found at $JDK"; exit 1; }
          echo "JAVA_HOME=$JDK" >> "$GITHUB_ENV"
          echo "$JDK/bin" >> "$GITHUB_PATH"

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore
