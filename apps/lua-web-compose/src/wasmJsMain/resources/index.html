<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lua-bytecode-obfuscator (compose web)</title>
<style>
  /* ComposeViewport appends its canvas to <body> and sizes it to the
     container's client box: html/body must span the full viewport with zero
     margins or the UI renders clipped / scrollable (known Compose-for-Web
     pitfall). */
  html, body { width: 100%; height: 100%; margin: 0; padding: 0; overflow: hidden; background: #fafafa; }
</style>
</head>
<body>
<!-- The production dist entry is pinned to composeApp.js
     (commonWebpackConfig.outputFileName in build.gradle.kts). It is a
     webpack UMD bundle whose runtime auto-detects publicPath from
     document.currentScript — that variable only exists for CLASSIC script
     tags, never inside dynamic import()/type=module, where the detection
     throws "Automatic publicPath is not supported in this browser". So the
     entry MUST stay a plain classic <script src>: it executes main() and
     boots ComposeViewport directly. -->
<script src="./composeApp.js"></script>
<script>
  // Load-failure surface: if the bundle throws or never boots, say so on the
  // page instead of leaving a blank canvas.
  window.addEventListener("error", function (event) {
    var message = document.createElement("pre");
    message.style.cssText = "white-space:pre-wrap;padding:1rem;font-family:system-ui;color:#b3261e;";
    message.textContent = "failed to boot the application:\n" + (event.message || event.error);
    document.body.appendChild(message);
  });
</script>
</body>
</html>
